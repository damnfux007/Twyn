name: Build Android APK & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  JAVA_VERSION: '17'

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Find APK file
        id: find-apk
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" -type f | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "apk_name=$(basename $APK)" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: twyn-apk
          path: ${{ steps.find-apk.outputs.apk_path }}
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: build-apk
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: twyn-apk
          path: ./release

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: "Twyn ${{ steps.version.outputs.version }}"
          tag_name: ${{ steps.version.outputs.version }}
          body: |
            ## Twyn ${{ steps.version.outputs.version }}

            ### Installation
            1. Download the APK below
            2. Enable "Install from unknown sources" on your Android device
            3. Open the APK to install
            4. Enter your name and server URL on the sign-in screen

            ### Server Setup (free, no credit card)
            1. Go to glitch.com → Import from GitHub → select damnfux007/Twyn
            2. Your server URL: https://your-project-name.glitch.me
            3. Enter wss://your-project-name.glitch.me/ws in the app

            ### Security
            - End-to-end encryption via Signal Protocol
            - Server never sees plaintext
            - Each paired connection has unique encryption keys
          files: ./release/*.apk
          draft: false
          prerelease: false
