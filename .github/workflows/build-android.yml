name: Build Android APK & Release

on:
  push:
    tags:
      - 'v*'    # Trigger on version tags like v1.0.0
  workflow_dispatch:  # Allow manual trigger

env:
  JAVA_VERSION: '17'
  ANDROID_SDK_VERSION: '34'

jobs:
  build-apk:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode keystore from secret
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
            --no-daemon
          echo "Release APK built"

      - name: Sign APK (alternative method)
        if: hashFiles('android/app/release.keystore') == ''
        working-directory: android
        run: |
          # If keystore not present, build debug APK instead
          ./gradlew assembleDebug --no-daemon
          echo "Debug APK built (no signing key provided)"

      - name: Find APK file
        id: find-apk
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" -type f | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "apk_name=$(basename $APK)" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: twyn-apk
          path: ${{ steps.find-apk.outputs.apk_path }}
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: build-apk
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: twyn-apk
          path: ./release

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building release for $VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: "Twyn ${{ steps.version.outputs.version }}"
          tag_name: ${{ steps.version.outputs.version }}
          body: |
            ## Twyn ${{ steps.version.outputs.version }}

            ### What's New
            - See commit history for changes

            ### Installation
            1. Download the APK below
            2. Enable "Install from unknown sources" on your Android device
            3. Open the APK to install
            4. Enter the server URL when prompted

            ### Server Setup
            The Twyn WebSocket server runs on Oracle Cloud Always Free tier.
            See `server/` directory for deployment instructions.

            ### Security
            - End-to-end encryption via Signal Protocol
            - Server never sees plaintext
            - Each paired connection has unique encryption keys
          files: |
            ./release/*.apk
          draft: false
          prerelease: false
