name: Deploy Server to Glitch

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Glitch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Glitch via API
        run: |
          # Glitch auto-imports from GitHub.
          # If the project exists, it syncs on push.
          # If not, create it by importing from GitHub.
          echo "Server files updated. Glitch will auto-sync from GitHub."
          echo "If first deploy: go to glitch.com → New Project → Import from GitHub → select damnfux007/Twyn"
          echo ""
          echo "To trigger a restart:"
          curl -X POST "https://api.glitch.com/v1/projects/<your-project-id>/restart" \
            -H "Authorization: Bearer ${{ secrets.GLITCH_TOKEN }}" || true
